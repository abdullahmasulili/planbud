# Precondition: a fresh disposable profile on the updated app, with English onboarding.
# Creates two synthetic income records to verify whole rupiah and fractional sen.
appId: com.planbud.app
name: IDR setup and exact rupiah display
---
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible: Meet PlanBud
    timeout: 60000
- tapOn: Continue
- tapOn: Allow protected storage
- tapOn: Continue
- scrollUntilVisible:
    element: Currency code
    direction: DOWN
- tapOn: Currency code
- scrollUntilVisible:
    element: IDR - Indonesia Rupiah
    direction: DOWN
    speed: 20
    timeout: 60000
- tapOn: IDR - Indonesia Rupiah
- scrollUntilVisible:
    element: I confirm IDR for my records
    direction: DOWN
- tapOn: I confirm IDR for my records
- scrollUntilVisible:
    element: Bahasa Indonesia
    direction: UP
- tapOn: Bahasa Indonesia
- scrollUntilVisible:
    element: Lanjutkan
    direction: DOWN
- tapOn: Lanjutkan
- assertVisible: Anda siap merencanakan masa depan
- tapOn: Mulai
- extendedWaitUntil:
    visible: Bulan Anda
    timeout: 60000
- tapOn: Buka tindakan cepat
- tapOn: Catat pengeluaran
- tapOn: Pemasukan
- runFlow:
    file: helpers/fill-field.yaml
    env:
      FIELD: 'Jumlah \(IDR\)'
      VALUE: '10000'
- tapOn: Simpan transaksi
- runFlow: helpers/hide-keyboard.yaml
- assertVisible: 'Pemasukan: Rp[\s\u00a0]?10\.000'
- extendedWaitUntil:
    notVisible: Transaksi disimpan
    timeout: 10000
- tapOn: Buka tindakan cepat
- tapOn: Catat pengeluaran
- tapOn: Pemasukan
- runFlow:
    file: helpers/fill-field.yaml
    env:
      FIELD: 'Jumlah \(IDR\)'
      VALUE: '0,50'
- tapOn: Simpan transaksi
- runFlow: helpers/hide-keyboard.yaml
- assertVisible: 'Pemasukan: Rp[\s\u00a0]?10\.000,50'
